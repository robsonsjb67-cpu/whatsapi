services:
  whatsapi:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/app/data   # sessões do WhatsApp (SQLite). Não apague!

  # Para usar Postgres em vez de SQLite, descomente abaixo e ajuste o .env:
